<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Сводка</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 600px; margin: 0 auto; padding: 16px; background: #0f172a; color: #f8fafc; line-height: 1.5; }
    h2 { margin-top: 0; font-size: 22px; }
    .card { background: #1e293b; padding: 16px; border-radius: 12px; margin-top: 16px; white-space: pre-wrap; font-size: 15px; border: 1px solid #334155; }
    .date { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
    button { background: #3b82f6; color: white; border: none; padding: 12px 16px; border-radius: 8px; font-size: 15px; font-weight: 600; width: 100%; cursor: pointer; }
    #status { font-size: 11px; color: #94a3b8; word-break: break-all; margin-top: 8px; background: #1e293b; padding: 8px; border-radius: 6px; display: none; user-select: all; }
  </style>
</head>
<body>
  <h2>⚡ ИИ-дайджест</h2>
  <button id="subBtn">Включить пуши и получить токен</button>
  <div id="status"></div>
  
  <div class="card">
    <div class="date" id="digestDate">Ожидание настройки сервера</div>
    <div id="digestText">Здесь появится ежедневная сводка новостей по сегментам.</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getMessaging, getToken } from "https://gstatic.com";

    // ВСТАВЬТЕ ВАШ CONFIG ИЗ FIREBASE
    const firebaseConfig = {
     apiKey: "AIzaSyDm510z18AorLRljFsSeNO4YNPwf2n27g8",
     authDomain: "ai-news-pwa.firebaseapp.com",
     projectId: "ai-news-pwa",
     storageBucket: "ai-news-pwa.firebasestorage.app",
     messagingSenderId: "274551981454",
     appId: "1:274551981454:web:1cfeec8be3432cfd85d0df",
     measurementId: "G-3Y8RQLPLCF"
    };
    const VAPID_KEY = "BGFiWpWzAgwieZQeXfxSAd4udMHgvAiJk2IzBKvi9qw3WHI8c01gcI0IgDm4MoVQLDlLA3kz29wK7CiXkiiMG4Y";
    const WORKER_URL = "ПОКА_ОСТАВИТЬ_ТАК";

    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);

    if (WORKER_URL.startsWith("http")) {
      fetch(`${WORKER_URL}/latest`)
        .then(r => r.json())
        .then(data => {
          document.getElementById('digestDate').innerText = data.date ? `Выпуск от ${data.date}` : "Ожидание выпуска";
          document.getElementById('digestText').innerText = data.text;
        })
        .catch(() => {});
    }

    document.getElementById('subBtn').addEventListener('click', async () => {
      const statusEl = document.getElementById('status');
      statusEl.style.display = 'block';
      statusEl.innerText = 'Запрос разрешения...';
      
      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          const registration = await navigator.serviceWorker.register('/ai-news/firebase-messaging-sw.js');
          const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });
          statusEl.innerText = token;
        } else {
          statusEl.innerText = 'Разрешение отклонено в настройках браузера.';
        }
      } catch (err) {
        statusEl.innerText = 'Ошибка: ' + err.message;
      }
    });
  </script>
</body>
</html>
